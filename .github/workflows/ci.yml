name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libxapian-dev libxml2-dev libxslt1-dev zlib1g-dev \
            qtbase5-dev qtwebengine5-dev qttools5-dev \
            libaspell-dev

      - name: Configure
        working-directory: src
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRECOLL_QT6_BUILD=OFF \
            -DRECOLL_ENABLE_WEBENGINE=ON \
            -DRECOLL_BUILD_TESTS=ON \
            -DRECOLL_QTGUI=OFF

      - name: Build
        working-directory: src
        run: cmake --build build --parallel

      - name: Run tests
        working-directory: src/build
        run: ctest --output-on-failure || ./catch/recoll_tests

  build-windows-gui:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-translations
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-xapian-core
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libxslt
            mingw-w64-x86_64-zlib
            zip

      - name: Fix xapian cmake config path
        run: |
          sed -i 's|^SET(prefix "/mingw64")|get_filename_component(prefix "${CMAKE_CURRENT_LIST_DIR}/../../../" ABSOLUTE)|' \
            /mingw64/lib/cmake/xapian/xapian-config.cmake

      - name: Configure
        run: |
          cmake -S src -B build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRECOLL_QT6_BUILD=ON \
            -DRECOLL_ENABLE_WEBENGINE=OFF \
            -DRECOLL_ENABLE_LIBMAGIC=OFF \
            -DRECOLL_ENABLE_SYSTEMD=OFF \
            -DRECOLL_ENABLE_X11MON=OFF \
            -DRECOLL_BUILD_TESTS=OFF \
            -DRECOLL_QTGUI=ON

      - name: Build
        run: cmake --build build_mingw --parallel

      - name: Verify GUI and CLI binaries
        run: |
          set -euo pipefail
          test -f build_mingw/recoll.exe || { echo "ERROR: recoll.exe (GUI) missing"; exit 1; }
          test -f build_mingw/recollindex.exe || { echo "ERROR: recollindex.exe missing"; exit 1; }
          test -f build_mingw/recollq.exe || { echo "ERROR: recollq.exe missing"; exit 1; }
          ls -lh build_mingw/recoll.exe build_mingw/recollindex.exe build_mingw/recollq.exe

      - name: Stage portable dist (GUI + Qt + filters)
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < src/RECOLL-VERSION.txt)
          rm -rf installer/dist
          mkdir -p installer/dist

          cp build_mingw/recoll.exe build_mingw/recollindex.exe build_mingw/recollq.exe installer/dist/
          cp src/desktop/recoll.ico installer/dist/

          # Deploy Qt runtime next to recoll.exe
          windeployqt6 --release --no-translations installer/dist/recoll.exe

          # MinGW / library DLLs commonly needed at runtime
          for dll in \
            libgcc_s_seh-1.dll libstdc++-6.dll libwinpthread-1.dll \
            libxapian-30.dll \
            libxml2-16.dll libxml2-2.dll libxml2.dll \
            libxslt-1.dll libxslt.dll \
            zlib1.dll libiconv-2.dll \
            libb2-1.dll libdouble-conversion.dll \
            libicuin78.dll libicuuc78.dll libicudt78.dll \
            libicuin77.dll libicuuc77.dll libicudt77.dll \
            libicuin76.dll libicuuc76.dll libicudt76.dll \
            libpcre2-16-0.dll libpcre2-8-0.dll libzstd.dll \
            libsystre-0.dll libtre-5.dll libintl-8.dll \
            libmd4c.dll libpng16-16.dll libfreetype-6.dll \
            libbz2-1.dll libbrotlidec.dll libbrotlicommon.dll \
            libharfbuzz-0.dll libgraphite2.dll libglib-2.0-0.dll \
            libpcre2-64-0.dll; do
            src="/$MSYSTEM_PREFIX/bin/$dll"
            if [ -f "$src" ]; then
              cp "$src" installer/dist/
            fi
          done

          mkdir -p installer/dist/share
          cp -r src/sampleconf installer/dist/share/
          cp -r src/filters installer/dist/share/

          echo "Staged files:"
          find installer/dist -maxdepth 2 -type f | sort | head -80
          test -f installer/dist/recoll.exe
          test -f installer/dist/platforms/qwindows.dll || \
            test -d installer/dist/platforms

          mkdir -p dist
          (
            cd installer/dist
            zip -r "../../dist/recoll-${VERSION}-win64-portable.zip" .
          )
          ls -lh "dist/recoll-${VERSION}-win64-portable.zip"

      - name: Build Inno Setup installer
        shell: cmd
        run: |
          for /f "delims=" %%v in (src\RECOLL-VERSION.txt) do set "RECOLL_VER=%%v"
          "%programfiles(x86)%\Inno Setup 6\ISCC.exe" /DMyAppVersion=%RECOLL_VER% installer\recoll.iss
          dir installer\Output\

      - name: Collect installer into dist/
        run: |
          set -euo pipefail
          mkdir -p dist
          cp installer/Output/recoll-*-win64-setup.exe dist/
          ls -lh dist/

      - name: Upload Windows GUI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: recoll-windows-gui
          path: |
            dist/*.zip
            dist/*.exe
            build_mingw/recoll.exe
            build_mingw/recollindex.exe
            build_mingw/recollq.exe
          if-no-files-found: error
          retention-days: 14
