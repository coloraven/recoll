name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            libxapian-dev libxml2-dev libxslt1-dev zlib1g-dev \
            qtbase5-dev qtwebengine5-dev qttools5-dev \
            libaspell-dev

      - name: Configure
        working-directory: src
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRECOLL_QT6_BUILD=OFF \
            -DRECOLL_ENABLE_WEBENGINE=ON \
            -DRECOLL_BUILD_TESTS=ON \
            -DRECOLL_QTGUI=OFF

      - name: Build
        working-directory: src
        run: cmake --build build --parallel

      - name: Run tests
        working-directory: src/build
        run: ctest --output-on-failure || ./catch/recoll_tests

  build-windows-gui:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-qt6-translations
            mingw-w64-x86_64-qt6-svg
            mingw-w64-x86_64-xapian-core
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-libxslt
            mingw-w64-x86_64-zlib
            zip

      - name: Fix xapian cmake config path
        run: |
          sed -i 's|^SET(prefix "/mingw64")|get_filename_component(prefix "${CMAKE_CURRENT_LIST_DIR}/../../../" ABSOLUTE)|' \
            /mingw64/lib/cmake/xapian/xapian-config.cmake

      - name: Configure
        run: |
          cmake -S src -B build_mingw -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRECOLL_QT6_BUILD=ON \
            -DRECOLL_ENABLE_WEBENGINE=OFF \
            -DRECOLL_ENABLE_LIBMAGIC=OFF \
            -DRECOLL_ENABLE_SYSTEMD=OFF \
            -DRECOLL_ENABLE_X11MON=OFF \
            -DRECOLL_BUILD_TESTS=OFF \
            -DRECOLL_QTGUI=ON

      - name: Build
        run: cmake --build build_mingw --parallel

      - name: Verify GUI and CLI binaries
        run: |
          set -euo pipefail
          test -f build_mingw/recoll.exe || { echo "ERROR: recoll.exe (GUI) missing"; exit 1; }
          test -f build_mingw/recollindex.exe || { echo "ERROR: recollindex.exe missing"; exit 1; }
          test -f build_mingw/recollq.exe || { echo "ERROR: recollq.exe missing"; exit 1; }
          test -f build_mingw/i18n/recoll_zh_CN.qm || {
            echo "ERROR: Chinese translation recoll_zh_CN.qm was not built"
            ls -la build_mingw/i18n || true
            exit 1
          }
          ls -lh build_mingw/recoll.exe build_mingw/recollindex.exe build_mingw/recollq.exe
          ls -lh build_mingw/i18n/recoll_zh*.qm

      # Package + publish on main push / manual dispatch (not PRs).
      # Binaries go to a GitHub Release — never committed into the git tree.
      - name: Stage portable package
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        run: |
          set -euo pipefail
          chmod +x packaging/windows/stage-dist.sh
          CONTINUOUS_ASSETS=1 packaging/windows/stage-dist.sh

      - name: Build Inno Setup installer
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        shell: cmd
        run: |
          for /f "delims=" %%v in (src\RECOLL-VERSION.txt) do set "RECOLL_VER=%%v"
          "%programfiles(x86)%\Inno Setup 6\ISCC.exe" /DMyAppVersion=%RECOLL_VER% installer\recoll.iss
          mkdir release-assets 2>nul
          copy /Y installer\Output\recoll-*-win64-setup.exe release-assets\recoll-win64-setup.exe
          dir release-assets

      - name: Publish continuous GitHub Release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous Windows GUI build
          prerelease: true
          generate_release_notes: true
          body: |
            Automated Windows GUI build from `main` (`${{ github.sha }}`).

            - `recoll-win64-portable.zip` — extract and run `recoll.exe`
            - `recoll-win64-setup.exe` — Inno Setup installer (Qt + MinGW runtime included)

            These assets are **not** stored in the git repository.
          files: |
            release-assets/recoll-win64-portable.zip
            release-assets/recoll-win64-setup.exe
